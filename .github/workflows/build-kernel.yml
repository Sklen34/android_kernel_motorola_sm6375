name: Build Kernel with KSU-Next v3.0.0

on:
  push:
    branches: [ 15.0-KSU-LOS ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        df -h
    
    - name: Checkout with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gcc g++ git libncurses5-dev libssl-dev python3 python3-pip zip zlib1g-dev libelf-dev gcc-aarch64-linux-gnu
    
    - name: Download Proton Clang toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain-clang
    
    - name: Setup KernelSU symbolic links
      run: |
        cd drivers/kernelsu
        for item in kernel/*; do
          basename=$(basename "$item")
          if [ -f "$item" ]; then
            ln -sf "$item" "$basename"
          elif [ -d "$item" ] && [ "$basename" != "." ]; then
            ln -sf "$item" "$basename"
          fi
        done
        cd ../..
    
    - name: Set correct KernelSU version
      run: |
        cd drivers/kernelsu
        sed -i 's/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := 32938/' Kbuild
        sed -i 's/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := v3.0.0-21-g0356464d/' Kbuild
        cd ../..
    
    - name: Disable WALT trace to fix compilation
      run: |
        # Remove trace.c from WALT compilation
        sed -i '/trace\.o/d' kernel/sched/walt/Makefile
        # Comment out trace includes
        sed -i 's/#include "trace\.c"/#define SKIP_TRACE/g' kernel/sched/walt/*.c || true
    
    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$(pwd)/toolchain-clang/bin:$PATH
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        make oldconfig
        make -j$(nproc) KCFLAGS="-Wno-error=format"
    
    - name: Prepare AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        cp arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../kernel-ksu-next-v3.0.0.zip * -x .git README.md *placeholder
    
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-ksu-next-v3.0.0
        path: kernel-ksu-next-v3.0.0.zip
